# Create the NetBox API token Secret referenced by HeraldConfig's
# spec.netbox.tokenSecretRef. Prefer creating this imperatively rather than
# committing a real token:
#
#   kubectl create secret generic netbox-herald-token \
#     --from-literal=token=<your NetBox API token>
#
# This file documents the expected shape for reference / for use with a
# secrets manager that renders Secret manifests (e.g. External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: netbox-herald-token
type: Opaque
stringData:
  token: REPLACE_ME
