# Stands up a real NetBox instance for local development and CI
# integration/e2e tests. Not used for production deployment — see the Helm
# chart under dist/chart for that.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down -v   # tear down, including the DB volume
#
# NetBox becomes reachable at http://localhost:8000 with the credentials
# below once migrations finish (check `docker compose logs -f netbox`).
name: netbox-herald-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
      POSTGRES_DB: netbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  netbox:
    image: netboxcommunity/netbox:v4.6-3.5.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: redis
      REDIS_CACHE_HOST: redis
      SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
      SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
      ALLOWED_HOSTS: "*"
      SKIP_STARTUP_SCRIPTS: "false"
    ports:
      - "8000:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login/"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
