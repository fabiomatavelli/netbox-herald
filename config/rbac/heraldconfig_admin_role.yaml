# This rule is not used by the project netbox-herald itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over herald.netbox-herald.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: netbox-herald
    app.kubernetes.io/managed-by: kustomize
  name: heraldconfig-admin-role
rules:
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs
  verbs:
  - '*'
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs/status
  verbs:
  - get
