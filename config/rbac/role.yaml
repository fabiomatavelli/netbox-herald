---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netbox-herald.io
  resources:
  - heraldconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - netbox-herald.io
  resources:
  - heraldconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - netbox-herald.io
  resources:
  - heraldconfigs/status
  verbs:
  - get
  - patch
  - update
