# -- String to partially override chart.fullname template (will maintain the release name)
# nameOverride: ""

# -- String to fully override chart.fullname template
# fullnameOverride: ""

# -- Configure the controller manager deployment
manager:
  # -- Set to false to skip manager installation
  enabled: true

  # -- Number of manager replicas
  replicas: 1

  image:
    # -- Manager image repository
    repository: controller
    # -- Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    # -- Image pull policy
    pullPolicy: IfNotPresent

  # -- Manager container arguments
  args:
    - --leader-elect

  # -- Manager container environment variables
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  # -- Env overrides (--set manager.envOverrides.VAR=value); a matching name in env above takes precedence
  envOverrides: {}

  # -- Image pull secrets
  # imagePullSecrets:
  #   - name: myregistrykey

  # -- Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  # -- Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Manager pod's affinity
  affinity: {}

  # -- Manager pod's node selector
  nodeSelector: {}

  # -- Manager pod's tolerations
  tolerations: []

  # -- Deployment strategy
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  # -- Priority class name
  # priorityClassName: ""

  # -- Topology spread constraints
  # topologySpreadConstraints: []

  # -- Termination grace period seconds
  terminationGracePeriodSeconds: 10

  # -- Custom Deployment labels
  # labels: {}

  # -- Custom Deployment annotations
  # annotations: {}

  # -- Custom Pod labels and annotations
  # pod:
  #   labels: {}
  #   annotations: {}

# -- RBAC configuration
rbac:
  # -- RBAC resource scope: false (default) installs a ClusterRole/ClusterRoleBinding covering all namespaces; true installs a namespaced Role/RoleBinding for the release namespace only
  namespaced: false

  helpers:
    # -- Install convenience admin/editor/viewer ClusterRoles for the CRDs
    enabled: false

# -- ServiceAccount configuration
serviceAccount:
  # -- Install the default ServiceAccount provided by this chart
  enabled: true

  # -- Existing ServiceAccount name to use instead (only when enabled=false); when enabled=true, respects nameOverride/fullnameOverride
  # name: ""

  # -- Custom ServiceAccount annotations
  # annotations: {}

  # -- Custom ServiceAccount labels
  # labels: {}

# -- Custom Resource Definitions
crd:
  # -- Install CRDs with the chart
  enabled: true
  # -- Keep CRDs when uninstalling the release
  keep: true

# -- Controller metrics endpoint; enable to expose /metrics
metrics:
  # -- Expose the manager's /metrics endpoint
  enabled: true
  # -- Metrics server port
  port: 8443
  # -- Serve metrics over HTTPS with certs/auth (true) or plain HTTP (false); HTTPS requires ClusterRole access for metrics authn/authz
  secure: true

# -- cert-manager integration for TLS certificates; required for webhook certificates and metrics endpoint certificates
certManager:
  enabled: false

# -- Prometheus ServiceMonitor for metrics scraping; requires prometheus-operator installed in the cluster
prometheus:
  enabled: false

# -- Network policies for controlling traffic flow; enable to restrict ingress to the controller manager
networkPolicy:
  enabled: false
