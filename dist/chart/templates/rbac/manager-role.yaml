apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "netbox-herald.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs/status
  verbs:
  - get
  - patch
  - update
