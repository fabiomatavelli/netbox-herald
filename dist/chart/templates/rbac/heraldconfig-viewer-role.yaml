{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "netbox-herald.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "netbox-herald.resourceName" (dict "suffix" "heraldconfig-viewer-role" "context" $) }}
rules:
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - herald.netbox-herald.io
  resources:
  - heraldconfigs/status
  verbs:
  - get
{{- end }}
