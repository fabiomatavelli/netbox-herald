                        type: string
                      lastSyncTime:
                        description: lastSyncTime is when this resource type was last
                          successfully synced.
                        format: date-time
                        type: string
                      objectCount:
                        description: |-
                          objectCount is the number of NetBox objects currently managed for this
                          resource type.
                        format: int32
                        type: integer
                      observedGeneration:
                        description: |-
                          observedGeneration is the .metadata.generation of the HeraldConfig
                          last reconciled for this resource type.
                        format: int64
                        type: integer
                    type: object
                  services:
                    description: services reports the sync state of the services resource.
                    properties:
                      enabled:
                        description: enabled mirrors the resource type's current enabled
                          state.
                        type: boolean
                      lastError:
                        description: |-
                          lastError is the error message from the most recent failed sync
                          attempt, if any. Cleared on the next successful sync.
                        type: string
                      lastSyncTime:
                        description: lastSyncTime is when this resource type was last
                          successfully synced.
                        format: date-time
                        type: string
                      objectCount:
                        description: |-
                          objectCount is the number of NetBox objects currently managed for this
