name: release

# Builds and publishes the versioned release artifacts once release-please
# merges its release PR and pushes the resulting vX.Y.Z tag: a multi-arch
# container image and the Helm chart, both to GHCR. release-please itself
# already creates the GitHub Release with changelog notes on that same tag
# push, so this workflow only handles the artifact side.

on:
  push:
    tags:
      - 'v*'
  # release-please creates release tags using the repo's default
  # GITHUB_TOKEN, and GitHub Actions deliberately does not let a
  # GITHUB_TOKEN-authenticated push trigger other workflows (anti-loop
  # safeguard) — so the push trigger above never fires for those tags.
  #
  # workflow_dispatch only runs the version of this file that exists on
  # the ref you dispatch against, so dispatching directly against an
  # existing vX.Y.Z tag doesn't work for any tag created before this
  # trigger itself was added to that tag's commit. Dispatch against a
  # branch (e.g. main) instead and pass the target tag explicitly via
  # this input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish artifacts for (e.g. v0.1.0)'
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/fabiomatavelli/netbox-herald:${{ steps.version.outputs.version }}
            ghcr.io/fabiomatavelli/netbox-herald:latest

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          helm package dist/chart \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination /tmp/chart-out
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/netbox-herald-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/fabiomatavelli/charts
