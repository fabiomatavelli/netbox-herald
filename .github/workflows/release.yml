name: release

# Builds and publishes the versioned release artifacts once release-please
# merges its release PR and pushes the resulting vX.Y.Z tag: a multi-arch
# container image and the Helm chart, both to GHCR. release-please itself
# already creates the GitHub Release with changelog notes on that same tag
# push, so this workflow only handles the artifact side.
#
# Each architecture builds natively in parallel on its own runner (no QEMU
# emulation), then a final job merges both single-arch images into one
# multi-arch manifest list under the release tags. See:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners

on:
  push:
    tags:
      - 'v*'
  # release-please creates release tags using the repo's default
  # GITHUB_TOKEN, and GitHub Actions deliberately does not let a
  # GITHUB_TOKEN-authenticated push trigger other workflows (anti-loop
  # safeguard) — so the push trigger above never fires for those tags.
  #
  # workflow_dispatch only runs the version of this file that exists on
  # the ref you dispatch against, so dispatching directly against an
  # existing vX.Y.Z tag doesn't work for any tag created before this
  # trigger itself was added to that tag's commit. Dispatch against a
  # branch (e.g. main) instead and pass the target tag explicitly via
  # this input.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish artifacts for (e.g. v0.1.0)'
        required: true

env:
  IMAGE: ghcr.io/fabiomatavelli/netbox-herald

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          touch "/tmp/digests/${digest}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Sanitize platform name for artifact name
        id: platform_pair
        run: echo "pair=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ steps.platform_pair.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push Helm chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          helm package dist/chart \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination /tmp/chart-out
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart-out/netbox-herald-${VERSION}.tgz" oci://ghcr.io/fabiomatavelli/charts
