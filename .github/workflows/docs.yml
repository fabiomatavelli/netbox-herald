name: docs

on:
  pull_request:

permissions: {}

jobs:
  docs-freshness:
    permissions:
      contents: read
    name: Docs Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Regenerate docs
        run: make docs

      - name: Fail if docs are stale
        run: |
          if ! git diff --exit-code -- docs/api-reference.md dist/chart/README.md; then
            echo "::error::docs/api-reference.md or dist/chart/README.md is stale. Run 'make docs' and commit the result."
            exit 1
          fi
